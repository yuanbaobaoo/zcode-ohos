name: Fix patch1 release notes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    # 一次性修补：仅本次提交触发；随后删除本文件。
    if: contains(github.event.head_commit.message, 'fix-release-notes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit release body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v3.18.2-ohos-patch1 --notes-file .github/release-note.md
