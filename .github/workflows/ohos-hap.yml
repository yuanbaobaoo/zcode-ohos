# HarmonyOS HAP 自动构建与发版
#
# 两条触发路径：workflow_dispatch（手动，产物进 Artifact 验证流程）；push tag v*（构建 + 未签名 HAP 发该 tag Release）。
# 工具链与依赖细节（CLT 分卷/sha256、libelectron 自动获取、空签名行为）见 specs/ohos-port/01。

name: OHOS HAP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # 可选：任意 command-line-tools 整包直链（http/file），设置后优先于分卷源。
  OHOS_CLT_URL: ${{ vars.OHOS_CLT_URL }}

jobs:
  build:
    name: Build unsigned HAP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space & install system deps
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          # libgl1/libx11-6：HMS 工具链运行时依赖（缺失 CompileResource 失败，见 specs/ohos-port/01）。
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libx11-6
          df -h /

      # full history：Release 说明需要 tag 之间的提交列表（git describe/log）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      # command-line-tools 自带 jbr；此步为保险（hvigor 找不到自带 jre 时兜底）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install OHOS command-line-tools
        run: |
          set -e
          mkdir -p /tmp/clt && cd /tmp/clt
          # 官方原包 26.0.0.851（API 26，向下兼容构建 6.0.2(22)），
          # 单资产超 GitHub 2GiB 上限故分卷；cat 合并为字节级无损拼接。
          EXPECTED_SHA256="ab604bd92721d5cbcafd154e6461d46b9f1b105e7b89eab04a9d046681198082"
          BASE="https://github.com/yuanbaobaoo/zcode-ohos/releases/download/ohos-tools"
          if [ -n "$OHOS_CLT_URL" ]; then
            # 自备整包直链（http/file）覆盖分卷源
            curl -fL --retry 3 "$OHOS_CLT_URL" -o clt.zip
          else
            curl -fL --retry 3 "$BASE/commandline-tools-linux-x64-26.0.0.851.zip.part1" -o clt.zip.part1
            curl -fL --retry 3 "$BASE/commandline-tools-linux-x64-26.0.0.851.zip.part2" -o clt.zip.part2
            cat clt.zip.part1 clt.zip.part2 > clt.zip
            rm -f clt.zip.part1 clt.zip.part2
          fi
          # 官方哈希锁定：内容被篡改/换版本即刻失败
          echo "$EXPECTED_SHA256  clt.zip" | sha256sum -c -
          unzip -q clt.zip -d "$HOME/ohos-clt"
          # 自动探测解压后的工具根目录（兼容不同 zip 层级），以 bin/hvigorw 为锚点。
          CLT_ROOT="$(dirname "$(dirname "$(find "$HOME/ohos-clt" -maxdepth 3 -name hvigorw -path "*/bin/*" | head -1)")")"
          echo "OHOS_COMMAND_LINE_TOOLS_ROOT=$CLT_ROOT" >> "$GITHUB_ENV"
          echo "command-line-tools: $CLT_ROOT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # zcode_sqlite.node 交叉编译（产物不入库，缺失会使 release 包装机即崩，issue #1）。
      # 工具链：clang 取自上方 CLT，Node 头文件取自 setup-node。
      - name: Build native sqlite binding
        run: |
          set -e
          mkdir -p /tmp/sqlite-src && cd /tmp/sqlite-src
          curl -fL --retry 3 https://sqlite.org/2026/sqlite-amalgamation-3530400.zip -o sqlite.zip
          unzip -q sqlite.zip
          packages/desktop/native/ohos-zcode-sqlite/build.sh /tmp/sqlite-src/sqlite-amalgamation-3530400
          ls -la packages/desktop/native/ohos-zcode-sqlite/zcode_sqlite.node

      - name: Bundle OHOS HAP (unsigned)
        run: pnpm bundle:desktop:ohos
        env:
          ZCODE_ENV: production # 未设时 identity 落 test/Preview 分支，产物名带 " Preview"
          ZCODE_OHOS_ELECTRON_AUTOFETCH: "1"

      - name: Generate checksums
        run: |
          cd packages/desktop/dist
          ls -la
          if ! ls ZCode-*-ohos-arm64-unsigned.hap >/dev/null 2>&1; then
            echo "::error::dist 未找到产物，实际内容: $(ls . | tr '\n' ' ' | cut -c1-200)"
            exit 1
          fi
          sha256sum ZCode-*-ohos-arm64-unsigned.hap > sha256.txt
          cat sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohos-hap-unsigned
          path: |
            packages/desktop/dist/ZCode-*-ohos-arm64-unsigned.hap
            packages/desktop/dist/sha256.txt
          retention-days: 14

      # 版本无关的 latest 别名资产：让 README 的
      # releases/latest/download/ZCode-latest-ohos-arm64-unsigned.hap 直链始终可下载。
      - name: Prepare latest alias artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd packages/desktop/dist
          cp ZCode-*-ohos-arm64-unsigned.hap ZCode-latest-ohos-arm64-unsigned.hap
          sha256sum ZCode-latest-ohos-arm64-unsigned.hap >> sha256.txt

      # Release 说明 = 上一个 tag 以来的真实提交列表 + 固定的安装/校验说明。
      # 不从 commit message 之外编造内容；首个 tag（无前驱）时列最近 20 条。
      - name: Compose release body
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --abbrev=0 --match='v*' "${TAG}^" 2>/dev/null || true)"
          {
            echo "## ${TAG}（上游基线 ${TAG%%-ohos*}）"
            echo
            if [ -n "$PREV" ]; then
              echo "### 自 ${PREV} 以来的变更"
              echo
              echo '```'
              git log --oneline --no-merges "${PREV}..${TAG}"
              echo '```'
            else
              echo "### 变更（最近 20 条）"
              echo
              echo '```'
              git log --oneline --no-merges -20 "${TAG}"
              echo '```'
            fi
            echo
            echo "### 安装与校验"
            echo
            echo "- 未签名 HAP（HarmonyOS PC / arm64）：需自行签名（debug Profile 绑定设备），或从源码构建（specs/ohos-port/01-构建与打包.md）"
            echo "- 完整性：附件 sha256.txt；长期直链 ZCode-latest-ohos-arm64-unsigned.hap 每次发版覆盖更新"
          } > release-body.md
          cat release-body.md

      - name: Publish Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/desktop/dist/ZCode-*-ohos-arm64-unsigned.hap
            packages/desktop/dist/ZCode-latest-ohos-arm64-unsigned.hap
            packages/desktop/dist/sha256.txt
          body_path: release-body.md
          generate_release_notes: false
